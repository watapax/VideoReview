<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Link no válido</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    html, body { height: 100%; }
    .not-found-shell {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    .not-found-card { max-width: 360px; }
    .not-found-card h1 { font-size: 18px; margin-bottom: 8px; }
    .not-found-card p { color: var(--muted); font-size: 13.5px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="not-found-shell">
    <div class="not-found-card">
      <h1>Este link ya no es válido</h1>
      <p>Puede que el video haya sido eliminado, o que el link esté incompleto. Pídele a tu profesor que te comparta el link de nuevo.</p>
    </div>
  </div>
</body>
</html>
