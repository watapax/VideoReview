<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Corrección de Animación</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/styles.css?v={{ asset_version('styles.css') }}">
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <h2 style="margin-top:0;">Corrección · Animación</h2>
      {% if error %}<div class="flash" style="border-color:#e88a6a;">{{ error }}</div>{% endif %}
      <form method="post" action="/login">
        <div class="field">
          <label for="name">Nombre</label>
          <input type="text" id="name" name="name" autofocus required value="{{ name or '' }}">
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button class="btn" type="submit" style="width:100%; justify-content:center;">Entrar</button>
      </form>
      <p class="muted" style="margin-bottom:0;">
        ¿Primera vez? <a href="/signup">Crea tu cuenta de docente</a>.
      </p>
    </div>
  </div>
</body>
</html>
